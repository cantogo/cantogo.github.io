<!DOCTYPE html><html lang="zh-CN"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粤语职场会议</title>
    <style>
        :root {
            --bg-body: #f4f6f8;
            --bg-card: #ffffff;
            --text-main: #2d3748;
            --text-sub: #718096;
            --border-color: #e2e8f0;
            --accent-color: #5a67d8;
            --playing-highlight: #fff9c4;
            --btn-bg: #edf2f7;
            --btn-hover: #e2e8f0;
            
            /* 角色颜色 */
            --apple-bg: #e3f2fd;
            --apple-border: #90caf9;
            --emma-bg: #f3e5f5;
            --emma-border: #ce93d8;
            --noah-bg: #e8f5e9;
            --noah-border: #a5d6a7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 30px;
            border: 1px solid var(--border-color);
        }

        header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 { font-size: 1.5rem; margin: 0 0 5px 0; }
        p.subtitle { margin: 0; color: var(--text-sub); font-size: 0.9rem; }

        /* 控制区 */
        .global-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            position: sticky;
            top: 10px;
            z-index: 10;
            background: var(--bg-card);
            padding: 10px 0;
            border-bottom: 1px solid transparent;
        }

        .main-btn {
            background-color: var(--bg-card);
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .main-btn:hover {
            background-color: var(--accent-color);
            color: white;
        }

        /* 列表样式 */
        .chat-list { display: flex; flex-direction: column; gap: 16px; }

        .message-row {
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 5px solid transparent;
            transition: background-color 0.3s;
        }

        .message-row.playing {
            background-color: var(--playing-highlight) !important;
            border-left-color: var(--accent-color) !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .role-label {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* 播放按钮 */
        .mini-play-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .mini-play-btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* 角色配色 */
        .role-Apple { background-color: var(--apple-bg); border: 1px solid var(--apple-border); border-left: 5px solid #2196f3; }
        .role-Emma { background-color: var(--emma-bg); border: 1px solid var(--emma-border); border-left: 5px solid #9c27b0; }
        .role-Noah { background-color: var(--noah-bg); border: 1px solid var(--noah-border); border-left: 5px solid #4caf50; }

        .text-content { font-size: 1.05rem; }
        .en-term { font-weight: 600; }

        .status-bar {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: right;
            padding: 10px;
            background: #f7fafc;
            border-radius: 4px;
        }
        
        .error-msg { color: #e53e3e; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>粤语职场会议</h1>
        <p class="subtitle">人物: Apple (Boss), Emma, Noah</p>
    </header>

    <div class="global-controls">
        <button class="main-btn" onclick="playAll()">▶ 全部播放</button>
        <button class="main-btn" onclick="stopAudio()">⏹ 停止</button>
    </div>

    <div class="chat-list" id="chatContainer"></div>

    <div class="status-bar" id="statusBar">准备就绪</div>
</div>

<script>
    // 脚本数据
    const scriptData = [
        { id: 1, role: "Apple", text: "大家早晨，今日个 agenda 好简单，主要系想倾下今年个圣诞 party 点搞，大家有冇咩 update？" },
        { id: 2, role: "Emma", text: "有嘅。我哋今年想 book 个酒店宴会厅，搞唱 K 晚会。" },
        { id: 6, role: "Noah", text: "个 idea 系好，不过今年公司个预算 cut 咗 30%，唔够钱租宴会厅，而且可能唔系咁多同事钟意唱 K。" },
        { id: 8, role: "Apple", text: "系啰，Noah 讲得啱。最紧要大家开心，同埋唔好 over budget。" },
        { id: 9, role: "Emma", text: "咁... 不如今年喺公司搞？叫到会啦。大家仲可以玩下游戏。" },
        { id: 10, role: "Apple", text: "呢个 idea 好好，就咁决定。Emma 你负责游戏嗰 part 同 check 下12月中边日搞好啲。Noah 你就负责 catering 同帮手整个 rundown，听日放工前 send 俾我睇睇。" },
        { id: 11, role: "Noah", text: "OK，我同 Emma 夹下，听日放工前俾个 draft 你。" },
        { id: 14, role: "Apple", text: "好，唔该晒大家，冇嘢就散会。" }
    ];

    // 全局音频对象
    let currentAudio = new Audio();
    let isPlayingAll = false;
    let currentIndex = 0;

    // 渲染页面
    function renderScript() {
        const container = document.getElementById('chatContainer');
        container.innerHTML = scriptData.map((line, index) => {
            const formattedText = line.text.replace(/([a-zA-Z\s\-]+)/g, '<span class="en-term">$1</span>');
            return `
            <div class="message-row role-${line.role}" id="msg-${index}">
                <div class="msg-header">
                    <span class="role-label">${line.role}</span>
                    <button class="mini-play-btn" onclick="playSingleLine(${index})">
                        🔊 播放
                    </button>
                </div>
                <div class="text-content">${formattedText}</div>
            </div>
            `;
        }).join('');
    }

    function updateStatus(text, isError = false) {
        const bar = document.getElementById('statusBar');
        bar.innerHTML = text;
        bar.className = isError ? 'status-bar error-msg' : 'status-bar';
    }

    function highlightMessage(index) {
        document.querySelectorAll('.message-row').forEach(el => el.classList.remove('playing'));
        if (index !== null) {
            const el = document.getElementById(`msg-${index}`);
            if (el) {
                el.classList.add('playing');
                // 滚动到当前播放位置
                const yOffset = -80; 
                const y = el.getBoundingClientRect().top + window.pageYOffset + yOffset;
                window.scrollTo({top: y, behavior: 'smooth'});
            }
        }
    }

    // 核心播放函数
    function playAudioFile(index, onComplete) {
        // 停止当前正在播放的
        currentAudio.pause();
        currentAudio.currentTime = 0;

        // 构造文件路径：假设文件在 mp3 文件夹下，命名为 1.mp3, 2.mp3...
        // 你可以根据实际情况修改这里的路径逻辑
        const fileIndex = index + 1; 
        const audioPath = `https://cantogo.github.io/voice/meeting_1-${fileIndex}.mp3`; 

        currentAudio.src = audioPath;
        
        // 监听加载错误（例如文件不存在）
        currentAudio.onerror = () => {
            updateStatus(`❌ 错误：找不到文件 ${audioPath}。请检查文件路径。`, true);
            highlightMessage(null);
            isPlayingAll = false;
        };

        // 监听播放结束
        currentAudio.onended = () => {
            if (onComplete) onComplete();
        };

        // 开始播放
        currentAudio.play().then(() => {
            updateStatus(`正在播放: ${audioPath}`);
        }).catch(e => {
            console.error(e);
            updateStatus(`❌ 播放失败: 浏览器可能阻止了自动播放，或文件格式错误。`, true);
        });
    }

    // 播放单句
    function playSingleLine(index) {
        stopAudio(); // 重置状态
        highlightMessage(index);
        playAudioFile(index, () => {
            highlightMessage(null);
            updateStatus("播放结束");
        });
    }

    // 播放全部
    function playAll() {
        stopAudio();
        isPlayingAll = true;
        currentIndex = 0;
        playNext();
    }

    // 递归播放下一句
    function playNext() {
        if (!isPlayingAll || currentIndex >= scriptData.length) {
            stopAudio();
            updateStatus("全段播放结束");
            return;
        }

        highlightMessage(currentIndex);
        
        playAudioFile(currentIndex, () => {
            // 当前这句播完后，延迟一小会儿播下一句
            currentIndex++;
            setTimeout(playNext, 500);
        });
    }

    function stopAudio() {
        isPlayingAll = false;
        currentAudio.pause();
        currentAudio.currentTime = 0;
        highlightMessage(null);
        updateStatus("已停止");
    }

    // 初始化
    renderScript();

</script>


</body></html>
