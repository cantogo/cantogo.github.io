        { m: "对不起", c: "对唔住", j: "deoi3 m4 zyu6", cat: "语气与交际", audio: "96" },
        { m: "没关系", c: "唔紧要", j: "m4 gan2 jiu3", cat: "语气与交际", audio: "97" },
        { m: "早上好", c: "早晨", j: "zou2 san4", cat: "语气与交际", audio: "98" },
        { m: "晚安", c: "早唞", j: "zou2 tau2", cat: "语气与交际", audio: "99" },
        { m: "再见", c: "拜拜", j: "baai1 baai3", cat: "语气与交际", audio: "100" }
    ];

    const QUESTIONS_PER_ROUND = 10;
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let isAnswered = false;
    let soundEnabled = true;

    // 播放音频
    function playAudio(audioUrl) {
        const url = "https://cantogo.github.io/voice/game_" + audioUrl + ".mp3";
        if (!soundEnabled || !url) return;
        try {
            const audio = new Audio(url);
            audio.play().catch(e => {
                console.log("音频播放被浏览器拦截或文件不存在，静音继续。");
            });
        } catch (e) {
            console.log("音频加载失败");
        }
    }

    // 随机打乱数组
    function shuffleArray(array) {
        const newArr = [...array];
        for (let i = newArr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
        }
        return newArr;
    }

    function showScreen(screenId) {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        
        const screen = document.getElementById(screenId);
        screen.classList.remove('hidden');
        
        screen.classList.remove('fade-in');
        void screen.offsetWidth; 
        screen.classList.add('fade-in');
    }

    function startGame() {
        const shuffledWords = shuffleArray(wordDatabase);
        currentQuestions = shuffledWords.slice(0, QUESTIONS_PER_ROUND);
        currentIndex = 0;
        score = 0;
        
        updateProgress();
        renderQuestion();
        showScreen('game-screen');
    }

    function updateProgress() {
        document.getElementById('progress-indicator').textContent = `进度: ${currentIndex + 1} / ${QUESTIONS_PER_ROUND}`;
        document.getElementById('score-indicator').textContent = `分数: ${score}`;
        const percentage = ((currentIndex) / QUESTIONS_PER_ROUND) * 100;
        document.getElementById('progress-bar').style.width = `${percentage}%`;
    }

    function renderQuestion() {
        isAnswered = false;
        const currentWord = currentQuestions[currentIndex];
        const correctLength = currentWord.c.length; // 获取正确答案的字数
        
        document.getElementById('question-word').textContent = currentWord.m;
        
        // 【核心逻辑：筛选字数相同的错误选项】
        let sameLengthWrongOptions = wordDatabase.filter(w => w.c.length === correctLength && w.c !== currentWord.c);
        
        // 如果相同字数的词不够3个，则用其他词补齐（在200词库中通常不会发生）
        if (sameLengthWrongOptions.length < 10) {
            const otherWrongOptions = wordDatabase.filter(w => w.c.length !== correctLength && w.c !== currentWord.c);
            sameLengthWrongOptions = sameLengthWrongOptions.concat(otherWrongOptions);
        }

        const shuffledWrong = shuffleArray(sameLengthWrongOptions).slice(0, 3);
        const options = shuffleArray([currentWord, ...shuffledWrong]);
        
        const optionsContainer = document.getElementById('options-grid');
        optionsContainer.innerHTML = '';
        
        options.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            // 在选项中预置波纹动画的HTML，默认隐藏
            btn.innerHTML = `
                <div>
                    <div class="option-canto">
                        ${opt.c} 
                        <div class="audio-wave" data-word="${opt.c}">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                    <div class="option-jyutping">${opt.j}</div>
                </div>
            `;
            btn.onclick = () => handleAnswer(opt, btn, currentWord);
            optionsContainer.appendChild(btn);
        });

        const qArea = document.getElementById('question-area');
        qArea.classList.remove('fade-in');
        void qArea.offsetWidth;
        qArea.classList.add('fade-in');
    }

    function handleAnswer(selectedOpt, btnElement, correctWord) {
        if (isAnswered) return;
        isAnswered = true;
        
        // 【核心逻辑：无论选对选错，只播放正确答案的发音】
        playAudio(correctWord.audio);
        
        const isCorrect = selectedOpt.c === correctWord.c;
        const allButtons = document.querySelectorAll('.option-btn');
        
        if (isCorrect) {
            score++;
            btnElement.classList.add('correct');
        } else {
            btnElement.classList.add('wrong');
            // 标出正确答案
            allButtons.forEach(b => {
                if (b.querySelector('.option-canto').textContent.includes(correctWord.c)) {
                    b.classList.add('correct');
                }
            });
        }
        
        // 【核心逻辑：在正确答案旁边显示播放波纹动画】
        const correctWave = document.querySelector(`.audio-wave[data-word="${correctWord.c}"]`);
        if (correctWave) {
            correctWave.classList.add('active');
        }
        
        allButtons.forEach(b => {
            b.disabled = true;
            if (!b.classList.contains('correct') && !b.classList.contains('wrong')) {
                b.classList.add('disabled-neutral');
            }
        });

        document.getElementById('score-indicator').textContent = `分数: ${score}`;
        const percentage = ((currentIndex + 1) / QUESTIONS_PER_ROUND) * 100;
        document.getElementById('progress-bar').style.width = `${percentage}%`;

        // 延迟2.5秒进入下一题，确保有足够时间听完正确发音并观察正确选项
        setTimeout(() => {
            currentIndex++;
            if (currentIndex < QUESTIONS_PER_ROUND) {
                updateProgress();
                renderQuestion();
            } else {
                endGame();
            }
        }, 2500);
    }

    function endGame() {
        document.getElementById('final-score').textContent = score;
        
        const feedbackEl = document.getElementById('feedback-message');
        if (score >= 9) {
            feedbackEl.textContent = "非常出色。你已经很好地掌握了这些词汇的差异，继续保持这份宁静的专注。";
        } else if (score >= 6) {
            feedbackEl.textContent = "做得很棒。慢慢建立起对两种语言差异的语感，不用着急，你已经做得很好了。";
        } else {
            feedbackEl.textContent = "每一次尝试都是一次积累。休息一下，按照自己的节奏慢慢来就好，这里永远欢迎你。";
        }
        
        showScreen('end-screen');
    }
</script>
