<script>

    // 核心播放函数
    function playAudioFile(index, onComplete) {
        // 停止当前正在播放的
        currentAudio.pause();
        currentAudio.currentTime = 0;

        // 构造文件路径
        const fileIndex = index + 1; 
        const audioPath = `https://cantogo.github.io/voice/meeting_2-${fileIndex}.mp3`; 

        currentAudio.src = audioPath;
        
        // 监听加载错误
        currentAudio.onerror = () => {
            updateStatus(`❌ 错误：找不到文件 ${audioPath}`, true);
            highlightMessage(null);
            isPlayingAll = false;
        };

        // 监听播放结束
        currentAudio.onended = () => {
            if (onComplete) onComplete();
        };

        // 开始播放
        currentAudio.play().then(() => {
            updateStatus(`正在播放 ...`);
        }).catch(e => {
            console.error(e);
            updateStatus(`❌ 播放失败: 请检查文件或浏览器设置`, true);
        });
    }

</script>
