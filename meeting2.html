<!DOCTYPE html><html lang="zh-CN"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粤语会议范例-2</title>
    <style>
        /* 默认浅色模式变量 */
        :root {
            --bg-body: #f4f6f8;
            --bg-card: #ffffff;
            --text-main: #2d3748;
            --text-sub: #4e6383;
            --border-color: #e2e8f0;
            --accent-color: #5a67d8;
            --accent-hover: #4c51bf;
            --playing-highlight: #fff9c4;
            --playing-border: #f6e05e;
            --btn-bg: #edf2f7;
            --btn-hover: #e2e8f0;
            --status-bg: #f7fafc;
            --accent: #0ea5e9;
            --accent-hover: #0ea5e9;
            
            /* 角色颜色 (浅色模式) */
            --zoe-bg: #e3f2fd;
            --zoe-border: #90caf9;
            --zoe-accent: #2196f3;
            
            --luca-bg: #f3e5f5;
            --luca-border: #ce93d8;
            --luca-accent: #9c27b0;
            
            --ruby-bg: #e8f5e9;
            --ruby-border: #a5d6a7;
            --ruby-accent: #4caf50;
        }

        /* 深色模式适配 */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #1a202c;
                --bg-card: #2d3748;
                --text-main: #f7fafc;
                --text-sub: #b8c0c9;
                --border-color: #4a5568;
                --accent-color: #7f9cf5;
                --accent-hover: #667eea;
                --playing-highlight: #443c16; /* 深黄色背景 */
                --playing-border: #d69e2e;
                --btn-bg: #4a5568;
                --btn-hover: #2d3748;
                --status-bg: #2d3748;
                --accent: #4da3ff;
                --accent-hover: #7bb8ff;

                /* 角色颜色 (深色模式 - 降低亮度与饱和度以适应深底) */
                --zoe-bg: rgba(33, 150, 243, 0.15);
                --zoe-border: #1e88e5;
                
                --luca-bg: rgba(156, 39, 176, 0.15);
                --luca-border: #8e24aa;
                
                --ruby-bg: rgba(76, 175, 80, 0.15);
                --ruby-border: #43a047;
            }
        }

        body {
            font-family: -Zoe-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        a {
            color: var(--accent);
        }

        a:hover {
            color: var(--accent-hover);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 30px;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        header {
            margin-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 { font-size: 1.65rem; margin: 0 0 5px 0; }
        p.subtitle { margin: 0; color: var(--text-sub); font-size: 1rem; }

        /* 控制区 */
        .global-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            position: sticky;
            top: 10px;
            z-index: 10;
            background: var(--bg-card);
            padding: 10px 0;
            border-bottom: 1px solid transparent;
            transition: background-color 0.3s;
        }

        .main-btn {
            background-color: var(--bg-card);
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .main-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-card); /* 反转颜色 */
        }

        /* 列表样式 */
        .chat-list { display: flex; flex-direction: column; gap: 16px; }

        .message-row {
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 5px solid transparent;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .message-row.playing {
            background-color: var(--playing-highlight) !important;
            border-left-color: var(--playing-border) !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .role-label {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* 播放按钮 */
        .mini-play-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .mini-play-btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* 角色配色 */
        .role-Zoe { 
            background-color: var(--zoe-bg); 
            border: 1px solid var(--zoe-border); 
            border-left: 5px solid var(--zoe-accent); 
        }
        .role-Luca { 
            background-color: var(--luca-bg); 
            border: 1px solid var(--luca-border); 
            border-left: 5px solid var(--luca-accent); 
        }
        .role-Ruby { 
            background-color: var(--ruby-bg); 
            border: 1px solid var(--ruby-border); 
            border-left: 5px solid var(--ruby-accent); 
        }

        .text-content { font-size: 1.05rem; }
        .en-term { font-weight: 600; opacity: 0.9; }

        .status-bar {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: right;
            padding: 10px;
            background: var(--status-bg);
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
        
        .error-msg { color: #e53e3e; }
        @media (prefers-color-scheme: dark) {
            .error-msg { color: #fc8181; }
        }
    
    /* Home Icon */
    .title-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
    }

    .home-icon {
      width: 43px;
      height: 43px;
      background: gba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
      border: 2px solid;
    }
        
    .home-icon:hover {
      background: lightgreen;
      border-color: lightgreen;
      transform: translateY(-2px);
    }
        
    .home-icon svg {
      width: 43px;
      height: 43px;
      fill: #0ea5e9;
    }

    </style>
</head>
<body>

<div class="container">
    <header class="title-bar">
    <div><h1>&#9319 粤语会议范例-2</h1></div>
      <nav>
        <div>
          <a href="https://cantogo.github.io" class="home-icon" title="轻轻松松、怏怏乐乐学粤语">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
            </svg>
          </a>
        </div>
      </nav>
    </header>

    <p class="subtitle">场景: 讨论 System Migration Project 进度</p>
    <p class="subtitle">人物: Zoe (Project Leader), Luca (Programmer), Ruby (System Analyst)</p>

    <div class="global-controls">
        <button class="main-btn" onclick="playAll()">▶ 全部播放</button>
        <button class="main-btn" onclick="stopAudio()">⏹ 停止</button>
    </div>

    <div class="chat-list" id="chatContainer"></div>

    <div class="status-bar" id="statusBar">准备就绪</div>
</div>

<script>
    // 脚本数据
    const scriptData = [
        { id: 1, role: "Zoe", text: "大家好。今日要 review 一下旧 system 转去新 cloud platform 嘅进度。下个月就系 project 嘅 deadline，我想知 data migration 做成点？" },
        { id: 2, role: "Luca", text: "大部份 user data 已经同步咗上去测试系统，不过，发现旧 database 有啲乱码问题。" },
        { id: 3, role: "Ruby", text: "系呀，我 check 过测试系统啲数据，发现有大概 5% 嘅客户数据唔见咗。另外，新系统个接口同旧嗰个好唔同，前线同事话唔识用。" },
        { id: 4, role: "Zoe", text: "Data migration 一定要尽快搞掂。Luca，你预计要几耐 fix 到个乱码问题？" },
        { id: 5, role: "Luca", text: "我要写个 script 去人手 map 个旧 database 啲数据，估计要开两日 OT，希望星期一可以再做一次 migration test。" },
        { id: 6, role: "Zoe", text: "好，辛苦晒你喇 Luca。至于 user 唔识用新 system 个问题，Ruby 你可唔可以帮手安排几个 training session 同整份 user guide 俾佢哋？" },
        { id: 7, role: "Ruby", text: "可以。我已经写紧份 user guide，预计星期五可以搞掂。另外我会 book 定会议室，下星期分批同啲同事上堂。" },
        { id: 8, role: "Zoe", text: "太好喇! 总结一下：Luca 专注搞 data fix，Ruby 负责 user training。大家保持沟通，唔该晒。" }
    ];

    // 全局音频对象
    let currentAudio = new Audio();
    let isPlayingAll = false;
    let currentIndex = 0;

    // 渲染页面
    function renderScript() {
        const container = document.getElementById('chatContainer');
        container.innerHTML = scriptData.map((line, index) => {
            const formattedText = line.text.replace(/([a-zA-Z\s\-]+)/g, '<span class="en-term">$1</span>');
            return `
            <div class="message-row role-${line.role}" id="msg-${index}">
                <div class="msg-header">
                    <span class="role-label">${line.role}</span>
                    <button class="mini-play-btn" onclick="playSingleLine(${index})">
                        🔊 播放
                    </button>
                </div>
                <div class="text-content">${formattedText}</div>
            </div>
            `;
        }).join('');
    }

    function updateStatus(text, isError = false) {
        const bar = document.getElementById('statusBar');
        bar.innerHTML = text;
        bar.className = isError ? 'status-bar error-msg' : 'status-bar';
    }

    function highlightMessage(index) {
        document.querySelectorAll('.message-row').forEach(el => el.classList.remove('playing'));
        if (index !== null) {
            const el = document.getElementById(`msg-${index}`);
            if (el) {
                el.classList.add('playing');
                // 滚动到当前播放位置
                const yOffset = -80; 
                const y = el.getBoundingClientRect().top + window.pageYOffset + yOffset;
                window.scrollTo({top: y, behavior: 'smooth'});
            }
        }
    }

    // 核心播放函数
    function playAudioFile(index, onComplete) {
        // 停止当前正在播放的
        currentAudio.pause();
        currentAudio.currentTime = 0;

        // 构造文件路径
        const fileIndex = index + 1; 
        const audioPath = `https://cantogo.github.io/voice/meeting_2-${fileIndex}.mp3`; 

        currentAudio.src = audioPath;
        
        // 监听加载错误
        currentAudio.onerror = () => {
            updateStatus(`❌ 错误：找不到文件 ${audioPath}`, true);
            highlightMessage(null);
            isPlayingAll = false;
        };

        // 监听播放结束
        currentAudio.onended = () => {
            if (onComplete) onComplete();
        };

        // 开始播放
        currentAudio.play().then(() => {
            updateStatus(`正在播放 ...`);
        }).catch(e => {
            console.error(e);
            updateStatus(`❌ 播放失败: 请检查文件或浏览器设置`, true);
        });
    }

    // 播放单句
    function playSingleLine(index) {
        stopAudio(); // 重置状态
        highlightMessage(index);
        playAudioFile(index, () => {
            highlightMessage(null);
            updateStatus("播放结束");
        });
    }

    // 播放全部
    function playAll() {
        stopAudio();
        isPlayingAll = true;
        currentIndex = 0;
        playNext();
    }

    // 递归播放下一句
    function playNext() {
        if (!isPlayingAll || currentIndex >= scriptData.length) {
            stopAudio();
            updateStatus("全段播放结束");
            return;
        }

        highlightMessage(currentIndex);
        
        playAudioFile(currentIndex, () => {
            currentIndex++;
            setTimeout(playNext, 300);
        });
    }

    function stopAudio() {
        isPlayingAll = false;
        currentAudio.pause();
        currentAudio.currentTime = 0;
        highlightMessage(null);
        updateStatus("已停止");
    }

    // 初始化
    renderScript();

</script>


</body></html>
